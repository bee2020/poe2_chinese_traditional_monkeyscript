name: POE2 Trade Userscript Auto Sync & Release

on:
  schedule:
    # 每天 UTC 0 点 (北京时间早 8 点) 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub Actions 页面随时手动一键触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 依赖缓存检查与恢复
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: 4. 安装依赖 (命中缓存则秒级跳过)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci || npm install

      - name: 5. 全自动拉取官方最新数据、同步并编译油猴脚本
        run: npm run build:all

      - name: 6. 运行完整性与有效性回归测试
        run: npm test

      - name: 7. 产物体积安全熔断与有效性检查
        run: |
          FILE="dist/poe_trade.user.js"
          if [ ! -f "$FILE" ]; then
            echo "❌ 错误: 产物文件 $FILE 不存在！"
            exit 1
          fi
          SIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE")
          echo "产物大小: $SIZE 字节"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "❌ 错误: 产物体积异常过小 (< 1MB)，疑似构建损坏，终止发布！"
            exit 1
          fi
          echo "✅ 产物大小校验通过。"

      - name: 7. 检测官方数据是否有实质更新
        id: git_check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add build_dict/ src/dict/ dist/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 官方数据与油猴脚本均无实质变动，无需提交，跳过 Release 更新。"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "🚀 检测到官方数据更新，正在提交新版本..."
            git commit -m "chore(auto-sync): update POE2 dictionaries and rebuild userscript [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: 8. 仅在有实质变动时发布/更新 GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.git_check.outputs.has_changes == 'true'
        with:
          tag_name: latest
          name: POE2 官方交易市集繁体中文增强版 (最新自动构建)
          files: dist/poe_trade.user.js
          body: |
            ## 自动构建说明
            本版本由 GitHub Actions 基于 GGG 国际服与台服官方 API 全自动拉取、构建并经过完整回归测试。

            - **油猴脚本直接安装地址**：[poe_trade.user.js](https://github.com/${{ github.repository }}/releases/download/latest/poe_trade.user.js)
            - **自动构建频率**：每天北京时间 08:00
