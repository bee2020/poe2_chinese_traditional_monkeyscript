name: POE2 Trade Dictionary Auto Sync

on:
  schedule:
    # 每天 UTC 0 点 (北京时间早 8 点) 自动执行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上随时点击按钮手动触发

permissions:
  contents: write

jobs:
  sync-dictionary:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 执行全自动官方数据拉取与繁中构建流水线
        run: node pipeline.cjs

      - name: 检测字典文件是否有更新并自动提交
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw/ dict/ changelogs/
          if git diff --staged --quiet; then
            echo "✅ 官方数据没有变化，无需提交更新。"
          else
            echo "🚀 检测到官方数据更新，正在自动提交推送至仓库..."
            git commit -m "chore(auto-sync): update POE2 official dictionaries and changelog [skip ci]"
            git push
          fi
